[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trove-knowledge-engine"
version = "0.1.0"
description = "A local-first knowledge engine with hybrid search, source connectors, plugin extensibility, and MCP integration for Claude Code."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Tom Gould"},
]
keywords = ["rag", "search", "knowledge-engine", "mcp", "embeddings", "bm25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Ranges are the versions tested in CI. Keep them in step with requirements.txt.
# The core install ingests and searches text, HTML and Markdown.
dependencies = [
    "torch>=2.15,<3",
    "sentence-transformers>=6.2,<7",
    "chromadb>=1.5,<2",
    "rank-bm25>=0.2.2,<0.3",
    "unstructured[md]>=0.27,<0.28",
    "nltk>=3.10,<4",
    "networkx>=3.6,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
    "markdownify>=1.2,<2",
    "trafilatura>=2.3,<3",
    "psutil>=7.2,<8",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
# PDF, Office and the other document formats
docs = [
    "unstructured[all-docs]>=0.27,<0.28",
]
# LM Studio and Claude clients, for agents, graph extraction and RAG answers
llm = [
    "openai>=3.46,<4",
    "anthropic>=2.6,<3",
]
# The MCP server
mcp = [
    "mcp>=1.30,<2",
]
# Code indexing. tree-sitter-languages has no wheels for Python 3.13
code = [
    "tree-sitter>=0.21.3,<0.22; python_version < '3.13'",
    "tree-sitter-languages>=1.10.2,<1.11; python_version < '3.13'",
]
dev = [
    "pytest>=9.2,<10",
    "ruff==0.17.1",
    "build>=1.2",
]
# Everything: the full stack. requirements.txt is this plus pytest
all = [
    "trove-knowledge-engine[docs,llm,mcp,code]",
]

[project.scripts]
trove-server = "scripts.mcp_server:main"

[tool.setuptools.packages.find]
include = ["core*", "mcp_server*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert usage (used in tests and whitelist checks)
    "S603",  # subprocess without shell=True (intentional in git_ops)
    "S607",  # partial executable path (git is expected in PATH)
    "B008",  # function call in default arg (used in FastAPI patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
