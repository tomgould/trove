name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  HF_HUB_DISABLE_TELEMETRY: "1"
  UNSTRUCTURED_DISABLE_NOTICE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with requires-python and the classifiers in pyproject.toml
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            constraints/*.txt

      - name: Cache embedding models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      # The CPU builds of PyTorch and torchvision first, as a matching pair:
      # sentence-transformers would otherwise pull the CUDA build, which fills
      # the runner's disk, and a torchvision built for another torch fails.
      - name: Install dependencies
        run: |
          constraints="constraints/py${{ matrix.python-version }}.txt"
          constraints="${constraints/./}"
          uv pip install --system $(grep -E '^torch(vision)?==' "$constraints") --index-url "$TORCH_INDEX"
          uv pip install --system -r requirements.txt -c "$constraints"

      - name: Run tests
        run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: constraints/py312.txt

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      # A clean venv outside the checkout, with the core dependencies only
      - name: Install the wheel without extras
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          uv pip install --python "$py" $(grep -E '^torch(vision)?==' constraints/py312.txt) --index-url "$TORCH_INDEX"
          uv pip install --python "$py" dist/*.whl -c constraints/py312.txt

      - name: Smoke test the core install
        run: |
          mkdir "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/smoke/core_smoke.py"
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/smoke/installed_smoke.py"

      - name: Smoke test the MCP server
        run: |
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$(ls dist/*.whl)[mcp]" -c constraints/py312.txt
          cd "$RUNNER_TEMP/run"
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          echo "$request" | timeout 300 "$RUNNER_TEMP/venv/bin/trove-server" > reply.json
          cat reply.json
          grep -q '"serverInfo"' reply.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.17.1"

      # Syntax errors and undefined names stop the build.
      - name: Check for errors
        run: ruff check --select E9,F63,F7,F82 core/ mcp_server/ scripts/ tests/ --output-format=github

      # The code hasn't been through a formatter yet, so this only reports.
      - name: Check formatting
        continue-on-error: true
        run: ruff format --check core/ mcp_server/ scripts/
